
name: "CodeQL C# Code Analysis"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL C# Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended,security-and-quality

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Replace the path below with your actual .sln path.
      - name: Restore solution
        run: dotnet restore "StudentManagementSystem.sln" 

      - name: Build solution
        run: dotnet build "StudentManagementSystem.sln" --no-restore --configuration Debug

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
